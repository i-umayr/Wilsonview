<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Groceries</title>
<meta name="theme-color" content="#D8EEE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C2629" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fridge: #D8EEE6;
    --fridge-shade: #C4E3D8;
    --paper: #FFFDF7;
    --rule: #E3EEF3;
    --margin-line: #F6B8BB;
    --ink: #2F3A4A;
    --ink-soft: #6B7686;
    --tape: rgba(247, 179, 43, 0.55);
    --button: #2F3A4A;
    --button-ink: #FFFDF7;
    --done: #5DBB63;
    --danger: #E5484D;
    --shadow: 0 1px 0 rgba(47,58,74,.06), 0 10px 24px -12px rgba(47,58,74,.35);
    --radius-paper: 6px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fridge: #1C2629;
      --fridge-shade: #243034;
      --paper: #2A3438;
      --rule: #34403F;
      --margin-line: #6E3F45;
      --ink: #EEF2EC;
      --ink-soft: #A3AFAE;
      --tape: rgba(247, 179, 43, 0.35);
      --button: #F7B32B;
      --button-ink: #1C2629;
      --shadow: 0 10px 24px -12px rgba(0,0,0,.7);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.4;
    color: var(--ink);
    background: var(--fridge);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 96px) env(safe-area-inset-left);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid #3FA7D6; outline-offset: 2px; }

  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 0; }

  /* Header */
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 2.6rem; line-height: 1; font-weight: 800; margin: 6px 0 4px; letter-spacing: -0.02em; }
  .subtitle { margin: 0; color: var(--ink-soft); font-size: 0.95rem; }
  .status { display: inline-flex; align-items: center; gap: 6px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
  .status.offline::before { background: #F7B32B; }

  /* Magnets (roommate avatars) */
  .magnet {
    --c: #999;
    display: inline-grid; place-items: center;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--c);
    color: #fff; font-weight: 800; font-size: 0.95rem; line-height: 1;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.35), 0 2px 4px rgba(0,0,0,.2);
    flex: none;
  }
  .magnet.sm { width: 20px; height: 20px; font-size: 0.7rem; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.2); }
  .me-btn {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: 0; padding: 4px; border-radius: 12px; color: var(--ink-soft); font-size: 0.8rem;
  }
  .me-btn .magnet { width: 48px; height: 48px; font-size: 1.4rem; }

  /* Notepad */
  .note {
    position: relative;
    background: var(--paper);
    border-radius: var(--radius-paper);
    box-shadow: var(--shadow);
    padding: 26px 0 8px;
  }
  .note::before { /* tape strip */
    content: ""; position: absolute; top: -10px; left: 50%; width: 110px; height: 24px;
    transform: translateX(-50%) rotate(-2deg);
    background: var(--tape); border-radius: 2px;
  }
  .note::after { /* red margin line */
    content: ""; position: absolute; top: 0; bottom: 0; left: 52px; width: 2px; background: var(--margin-line); opacity: .7;
    pointer-events: none;
  }

  .add-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 0 14px 14px 64px; border-bottom: 2px solid var(--rule); }
  .add-form .fields { display: grid; gap: 6px; }
  .add-form input {
    width: 100%; border: 0; background: transparent; padding: 6px 0; outline: none;
    border-bottom: 2px dashed var(--rule);
  }
  .add-form input:focus { border-bottom-color: var(--ink-soft); }
  .add-form input::placeholder { color: var(--ink-soft); opacity: .8; }
  .add-form #itemName { font-size: 1.2rem; font-weight: 600; }
  .add-form #itemNote { font-size: 0.95rem; }
  .add-btn {
    align-self: center;
    width: 52px; height: 52px; border-radius: 50%; border: 0;
    background: var(--button); color: var(--button-ink);
    font-size: 1.9rem; font-weight: 700; line-height: 1;
    display: grid; place-items: center;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.2);
    transition: transform .12s ease;
  }
  .add-btn:active { transform: scale(.92); }

  .list-head { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 16px 4px 64px; }
  .list-head h2 { margin: 0; font-size: 1.15rem; font-weight: 700; }
  .count { color: var(--ink-soft); font-size: 0.9rem; }

  ul.items { list-style: none; margin: 0; padding: 0; }
  .item {
    display: grid; grid-template-columns: 52px 1fr auto; align-items: center;
    min-height: 60px; border-bottom: 2px solid var(--rule);
    padding: 6px 10px 6px 0;
  }
  .item:last-child { border-bottom: 0; }
  .check {
    justify-self: center;
    width: 30px; height: 30px; border-radius: 50%;
    border: 2.5px solid var(--ink-soft); background: transparent;
    display: grid; place-items: center; padding: 0;
    transition: background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .check svg { width: 16px; height: 16px; opacity: 0; transition: opacity .15s ease; }
  .check:hover svg { opacity: .35; }
  .item.ticking .check { background: var(--done); border-color: var(--done); transform: scale(1.12); }
  .item.ticking .check svg { opacity: 1; color: #fff; }
  .item.ticking .name { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-soft); }
  .body { min-width: 0; padding-left: 12px; }
  .name { font-size: 1.15rem; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; transition: color .2s ease; }
  .name .emoji { margin-right: 4px; }
  .note-text { font-size: 0.92rem; color: var(--ink-soft); overflow-wrap: anywhere; }
  .meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 0.8rem; color: var(--ink-soft); }
  .icon-btn {
    border: 0; background: transparent; color: var(--ink-soft);
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  }
  .icon-btn:hover { background: var(--rule); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }

  .empty { padding: 26px 16px 30px 64px; color: var(--ink-soft); }
  .empty strong { display: block; color: var(--ink); font-size: 1.15rem; }

  /* Recently bought */
  .bought { margin-top: 22px; }
  .bought summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 6px; font-weight: 700; font-size: 1.05rem;
  }
  .bought summary::-webkit-details-marker { display: none; }
  .bought summary .chev { transition: transform .2s ease; color: var(--ink-soft); }
  .bought[open] summary .chev { transform: rotate(180deg); }
  .bought .note { padding-top: 6px; }
  .bought .note::before { display: none; }
  .bought .item .name { text-decoration: line-through; text-decoration-color: var(--ink-soft); color: var(--ink-soft); }
  .done-dot { justify-self: center; width: 26px; height: 26px; border-radius: 50%; background: var(--done); display: grid; place-items: center; color: #fff; opacity: .85; }
  .done-dot svg { width: 14px; height: 14px; }
  .again-btn {
    border: 2px solid var(--rule); background: transparent; border-radius: 999px;
    padding: 4px 12px; font-size: 0.85rem; font-weight: 600; white-space: nowrap;
  }
  .again-btn:hover { border-color: var(--ink-soft); }
  .hint { font-size: 0.8rem; color: var(--ink-soft); padding: 8px 16px 4px 64px; }

  /* Name picker */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    background: color-mix(in srgb, var(--fridge) 85%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: grid; place-items: center; padding: 20px;
  }
  .overlay[hidden] { display: none; }
  .picker { width: 100%; max-width: 380px; background: var(--paper); border-radius: 18px; padding: 24px 20px 20px; box-shadow: var(--shadow); }
  .picker h2 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
  .picker p { margin: 0 0 18px; color: var(--ink-soft); }
  .picker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 16px 8px; border-radius: 14px; border: 2px solid var(--rule); background: transparent;
    font-weight: 700; font-size: 1.05rem;
    transition: transform .12s ease, border-color .12s ease;
  }
  .pick .magnet { width: 56px; height: 56px; font-size: 1.6rem; }
  .pick:active { transform: scale(.96); }
  .pick.current { border-color: var(--ink); }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); z-index: 30;
    transform: translate(-50%, 140%);
    width: min(488px, calc(100% - 32px));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--ink); color: var(--paper);
    padding: 10px 10px 10px 16px; border-radius: 14px; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5);
    transition: transform .25s cubic-bezier(.2,.9,.3,1.2);
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast button { border: 0; background: var(--paper); color: var(--ink); border-radius: 10px; padding: 6px 14px; font-weight: 700; white-space: nowrap; }
  .toast button[hidden] { display: none; }

  /* Setup notice */
  .setup { background: var(--paper); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); }
  .setup h2 { margin-top: 0; }
  .setup code { background: var(--rule); padding: 1px 6px; border-radius: 4px; font-size: .9em; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Groceries</h1>
      <p class="subtitle"><span id="status" class="status">Live</span></p>
    </div>
    <button class="me-btn" id="meBtn" type="button" aria-label="Switch who you are">
      <span class="magnet" id="meMagnet">?</span>
      <span id="meLabel">Pick name</span>
    </button>
  </header>

  <main id="app">
    <section class="note" aria-label="Shopping list">
      <form class="add-form" id="addForm" autocomplete="off">
        <div class="fields">
          <input id="itemName" type="text" maxlength="80" placeholder="What do we need?" aria-label="Item name" enterkeyhint="done">
          <input id="itemNote" type="text" maxlength="80" placeholder="Amount or note (optional)" aria-label="Amount or note" enterkeyhint="done">
        </div>
        <button class="add-btn" type="submit" aria-label="Add to list">+</button>
      </form>

      <div class="list-head">
        <h2>To buy</h2>
        <span class="count" id="neededCount"></span>
      </div>
      <ul class="items" id="neededList"></ul>
    </section>

    <details class="bought" id="boughtWrap">
      <summary><span id="boughtTitle">Recently bought</span><span class="chev" aria-hidden="true">▾</span></summary>
      <section class="note">
        <ul class="items" id="boughtList"></ul>
        <p class="hint">Bought items clear themselves after 7 days.</p>
      </section>
    </details>
  </main>
</div>

<div class="overlay" id="picker" hidden>
  <div class="picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <h2 id="pickerTitle">Who's this?</h2>
    <p>Tap your name. This phone will remember it.</p>
    <div class="picker-grid" id="pickerGrid"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button type="button" id="toastBtn" hidden></button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, addDoc, updateDoc, deleteDoc, setDoc, onSnapshot,
  serverTimestamp, deleteField
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   1) PASTE YOUR FIREBASE CONFIG HERE (see README.md)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCM3KIgHh1-Od16B6803_wK3Gm5hWyWWp8",
  authDomain: "wilsonview.firebaseapp.com",
  projectId: "wilsonview",
  storageBucket: "wilsonview.firebasestorage.app",
  messagingSenderId: "930833074497",
  appId: "1:930833074497:web:35c6e433ca87ca385a39c0"
};

/* The four of you. Colors are each person's "fridge magnet". */
const ROOMMATES = [
  { name: "Umair",    color: "#F2545B" },
  { name: "Mubashir", color: "#3FA7D6" },
  { name: "Zain",     color: "#E09A10" },
  { name: "Noman",    color: "#5DBB63" }
];
const CLEAR_BOUGHT_AFTER_DAYS = 7;

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const person = (name) => ROOMMATES.find(r => r.name === name) || { name: name || "Someone", color: "#9AA3AE" };
const magnet = (name, cls = "") => {
  const p = person(name);
  return `<span class="magnet ${cls}" style="--c:${p.color}" aria-hidden="true">${esc(p.name[0])}</span>`;
};
const ms = (t) => (t && typeof t.toMillis === "function") ? t.toMillis() : Date.now();
const norm = (s) => s.toLowerCase().trim().replace(/\s+/g, " ").replace(/(es|s)$/, "");

function ago(t) {
  const diff = Math.max(0, Date.now() - ms(t));
  const m = Math.floor(diff / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  if (d === 1) return "yesterday";
  return `${d} days ago`;
}

const EMOJI = [
  ["eggplant","🍆"],["ice cream","🍦"],["toilet paper","🧻"],["toothpaste","🪥"],["dish soap","🍽️"],
  ["milk","🥛"],["egg","🥚"],["bread","🍞"],["rice","🍚"],["chicken","🍗"],["beef","🥩"],["meat","🥩"],["mince","🥩"],
  ["fish","🐟"],["cheese","🧀"],["butter","🧈"],["yogurt","🥛"],["yoghurt","🥛"],["dahi","🥛"],
  ["apple","🍎"],["banana","🍌"],["juice","🧃"],["orange","🍊"],["lemon","🍋"],["lime","🍋"],["mango","🥭"],["grape","🍇"],["strawberr","🍓"],
  ["tomato","🍅"],["potato","🥔"],["onion","🧅"],["garlic","🧄"],["ginger","🫚"],["carrot","🥕"],["chili","🌶️"],["chilli","🌶️"],["pepper","🫑"],
  ["cucumber","🥒"],["lettuce","🥬"],["spinach","🥬"],["avocado","🥑"],["corn","🌽"],["mushroom","🍄"],
  ["water","💧"],["coffee","☕"],["tea","🍵"],["soda","🥤"],["coke","🥤"],["pepsi","🥤"],
  ["sugar","🍬"],["salt","🧂"],["oil","🫒"],["flour","🌾"],["atta","🌾"],["pasta","🍝"],["spaghetti","🍝"],["noodle","🍜"],
  ["cereal","🥣"],["oats","🥣"],["honey","🍯"],["chocolate","🍫"],["cookie","🍪"],["biscuit","🍪"],["chips","🥔"],["snack","🍿"],["pizza","🍕"],
  ["soap","🧼"],["shampoo","🧴"],["detergent","🧺"],["tissue","🧻"],["napkin","🧻"],["sponge","🧽"],["trash bag","🗑️"],["garbage","🗑️"],
  ["batter","🔋"],["bulb","💡"]
];
function emojiFor(name) {
  const n = name.toLowerCase();
  for (const [k, e] of EMOJI) if (new RegExp(`\\b${k}`).test(n)) return e;
  return "🛒";
}

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, actionLabel, action) {
  $("toastMsg").textContent = msg;
  const btn = $("toastBtn");
  btn.hidden = !actionLabel;
  btn.textContent = actionLabel || "";
  btn.onclick = () => { hideToast(); action && action(); };
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 6000 : 3000);
}
function hideToast() { $("toast").classList.remove("show"); }

/* ---------- who am I ---------- */
let me = store.get("cart-me");
if (!ROOMMATES.some(r => r.name === me)) me = null;

function renderMe() {
  const p = me ? person(me) : null;
  $("meMagnet").style.setProperty("--c", p ? p.color : "#9AA3AE");
  $("meMagnet").textContent = p ? p.name[0] : "?";
  $("meLabel").textContent = p ? p.name : "Pick name";
}
function openPicker() {
  $("pickerGrid").innerHTML = ROOMMATES.map(r => `
    <button type="button" class="pick ${r.name === me ? "current" : ""}" data-name="${esc(r.name)}">
      ${magnet(r.name)}<span>${esc(r.name)}</span>
    </button>`).join("");
  $("picker").hidden = false;
}
$("pickerGrid").addEventListener("click", (e) => {
  const b = e.target.closest(".pick");
  if (!b) return;
  me = b.dataset.name;
  store.set("cart-me", me);
  renderMe();
  $("picker").hidden = true;
  toast(`Hi ${me}! 👋`);
});
$("meBtn").addEventListener("click", openPicker);
renderMe();

/* ---------- setup check ---------- */
if (firebaseConfig.apiKey.startsWith("PASTE")) {
  $("app").innerHTML = `
    <div class="setup">
      <h2>Almost ready</h2>
      <p>Paste your Firebase config into <code>index.html</code> where it says <code>PASTE YOUR FIREBASE CONFIG HERE</code>. The steps are in <code>README.md</code>.</p>
    </div>`;
  $("status").textContent = "Not connected";
  $("status").classList.add("offline");
  throw new Error("Firebase config missing");
}
if (!me) openPicker();

/* ---------- firebase ---------- */
const app = initializeApp(firebaseConfig);
let db;
try {
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch {
  db = initializeFirestore(app, {});
}
const itemsCol = collection(db, "items");

let items = [];
let firstLoad = true;

onSnapshot(itemsCol, (snap) => {
  items = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) }));
  if (firstLoad) { firstLoad = false; cleanupOld(); }
  render();
}, (err) => {
  console.error(err);
  toast("Can't reach the list. Check the Firestore rules in README.md.");
});

function cleanupOld() {
  const cutoff = Date.now() - CLEAR_BOUGHT_AFTER_DAYS * 86400000;
  items.filter(i => i.status === "bought" && i.boughtAt && ms(i.boughtAt) < cutoff)
       .forEach(i => deleteDoc(doc(db, "items", i.id)).catch(() => {}));
}

/* ---------- render ---------- */
const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const X_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;

function render() {
  const needed = items.filter(i => i.status !== "bought").sort((a, b) => ms(b.addedAt) - ms(a.addedAt));
  const bought = items.filter(i => i.status === "bought").sort((a, b) => ms(b.boughtAt) - ms(a.boughtAt));

  $("neededCount").textContent = needed.length ? `${needed.length} item${needed.length === 1 ? "" : "s"}` : "";
  $("neededList").innerHTML = needed.length ? needed.map(i => `
    <li class="item" data-id="${i.id}">
      <button type="button" class="check" data-action="buy" aria-label="Mark ${esc(i.name)} as bought">${CHECK_SVG}</button>
      <div class="body">
        <div class="name"><span class="emoji" aria-hidden="true">${emojiFor(i.name)}</span>${esc(i.name)}</div>
        ${i.note ? `<div class="note-text">${esc(i.note)}</div>` : ""}
        <div class="meta">${magnet(i.addedBy, "sm")}<span>Added by ${esc(person(i.addedBy).name)}, ${ago(i.addedAt)}</span></div>
      </div>
      <button type="button" class="icon-btn" data-action="delete" aria-label="Remove ${esc(i.name)}">${X_SVG}</button>
    </li>`).join("")
    : `<li class="empty"><strong>Nothing to buy 🎉</strong>Add something above when you run out.</li>`;

  $("boughtTitle").textContent = bought.length ? `Recently bought (${bought.length})` : "Recently bought";
  $("boughtList").innerHTML = bought.length ? bought.map(i => `
    <li class="item" data-id="${i.id}">
      <span class="done-dot" aria-hidden="true">${CHECK_SVG}</span>
      <div class="body">
        <div class="name"><span class="emoji" aria-hidden="true">${emojiFor(i.name)}</span>${esc(i.name)}</div>
        <div class="meta">${magnet(i.boughtBy, "sm")}<span>${esc(person(i.boughtBy).name)} got it, ${ago(i.boughtAt)}</span></div>
      </div>
      <button type="button" class="again-btn" data-action="again">Need again</button>
    </li>`).join("")
    : `<li class="empty">Items you tick off will show up here.</li>`;
}
setInterval(render, 60000);

/* ---------- actions ---------- */
function requireMe() {
  if (me) return true;
  openPicker();
  return false;
}

async function addItem(name, note) {
  await addDoc(itemsCol, { name, note, status: "needed", addedBy: me, addedAt: serverTimestamp() });
}

async function needAgain(item, note) {
  await updateDoc(doc(db, "items", item.id), {
    status: "needed", addedBy: me, addedAt: serverTimestamp(),
    note: note ?? item.note ?? "",
    boughtBy: deleteField(), boughtAt: deleteField()
  });
}

$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!requireMe()) return;
  const name = $("itemName").value.trim();
  const note = $("itemNote").value.trim();
  if (!name) { $("itemName").focus(); return; }

  const key = norm(name);
  const onList = items.find(i => i.status !== "bought" && norm(i.name) === key);
  const wasBought = items.find(i => i.status === "bought" && norm(i.name) === key);

  const clear = () => { $("itemName").value = ""; $("itemNote").value = ""; $("itemName").focus(); };

  try {
    if (onList) {
      toast(`${onList.name} is already on the list`, "Add anyway", async () => { await addItem(name, note); clear(); });
      return;
    }
    if (wasBought) await needAgain(wasBought, note || wasBought.note || "");
    else await addItem(name, note);
    clear();
  } catch (err) {
    console.error(err);
    toast("Couldn't add that. Try again.");
  }
});

document.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const li = btn.closest(".item");
  const item = items.find(i => i.id === li?.dataset.id);
  if (!item) return;
  const ref = doc(db, "items", item.id);

  try {
    if (btn.dataset.action === "buy") {
      if (!requireMe()) return;
      li.classList.add("ticking");
      await new Promise(r => setTimeout(r, 380));
      await updateDoc(ref, { status: "bought", boughtBy: me, boughtAt: serverTimestamp() });
      toast(`Got ${item.name}. Nice one, ${me}!`, "Undo", () =>
        updateDoc(ref, { status: "needed", boughtBy: deleteField(), boughtAt: deleteField() }));
    }

    if (btn.dataset.action === "delete") {
      const { id, ...data } = item;
      await deleteDoc(ref);
      toast(`Removed ${item.name}`, "Undo", () => setDoc(ref, data));
    }

    if (btn.dataset.action === "again") {
      if (!requireMe()) return;
      const dupe = items.find(i => i.status !== "bought" && norm(i.name) === norm(item.name));
      if (dupe) { toast(`${item.name} is already on the list`); return; }
      await needAgain(item);
      toast(`${item.name} is back on the list`);
    }
  } catch (err) {
    console.error(err);
    li?.classList.remove("ticking");
    toast("That didn't save. Check your connection.");
  }
});

/* ---------- online status ---------- */
function updateStatus() {
  const on = navigator.onLine;
  $("status").textContent = on ? "Live, synced with everyone" : "Offline, will sync later";
  $("status").classList.toggle("offline", !on);
}
window.addEventListener("online", updateStatus);
window.addEventListener("offline", updateStatus);
updateStatus();
</script>
</body>
</html>
